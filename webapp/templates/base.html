<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2937">
  <title>{{ page_title }} · Portfolio Tracker</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/portfolio" class="brand">
        <span class="brand-icon" aria-hidden="true">📈</span>
        <span class="brand-text">Portfolio Tracker</span>
      </a>

      <button class="nav-toggle" id="navToggle"
              aria-label="Toggle navigation menu"
              aria-expanded="false"
              aria-controls="primaryNav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="primary-nav" id="primaryNav" aria-label="Primary">
        <a href="/portfolio"   class="nav-link {% if active_nav == 'portfolio' %}is-active{% endif %}">Portfolio</a>
        <a href="/fairvalue"   class="nav-link {% if active_nav == 'fairvalue' %}is-active{% endif %}">Fair Value</a>
        <a href="/history"     class="nav-link {% if active_nav == 'history'   %}is-active{% endif %}">History</a>
        <a href="/settings"    class="nav-link {% if active_nav == 'settings'  %}is-active{% endif %}">Settings</a>
      </nav>
    </div>
  </header>

  <main id="main" class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Portfolio Tracker · {{ snapshot.asof if snapshot and snapshot.asof else '' }}</span>
      <span class="footer-sep">·</span>
      <a href="/api/health">API health</a>
    </div>
  </footer>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
