[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-tracker"
version = "0.1.0"
description = "Personal portfolio tracker: Angel One equity + mutual funds + SGBs vs world indices"
requires-python = ">=3.10"
dependencies = [
    "smartapi-python>=1.3.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "logzero>=1.7.0",
    "websocket-client>=1.6.0",
    "plotly>=5.18.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx2>=0.0.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",      # for mocking requests in tests
    "ruff>=0.4.0",
]

[tool.setuptools]
py-modules = [
    "angel_client",
    "mf_sgb",
    "indices_chart",
    "indices_html",
    "equity_compare",
    "cas_parser",
    "cas_dump",
    "logging_setup",
    "history_db",
    "parallel",
    "portfolio_html",
    "fairvalue",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.format]
quote-style = "double"